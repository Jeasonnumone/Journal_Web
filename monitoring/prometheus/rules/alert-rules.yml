groups:
  # 应用告警规则
  - name: application_alerts
    rules:
      # 应用宕机告警
      - alert: ApplicationDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "应用 {{ $labels.job }} 宕机"
          description: "应用 {{ $labels.instance }} 已经宕机超过 1 分钟"

      # HTTP 错误率过高
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (application)
          /
          sum(rate(http_server_requests_seconds_count[5m])) by (application) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "应用 {{ $labels.application }} 错误率过高"
          description: "5xx 错误率超过 5%，当前值: {{ $value | printf \"%.2f\" }}"

      # HTTP 响应时间过长
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, application)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "应用 {{ $labels.application }} 响应时间过长"
          description: "95分位响应时间超过 1 秒，当前值: {{ $value | printf \"%.2f\" }}s"

  # JVM 告警规则
  - name: jvm_alerts
    rules:
      # JVM 堆内存使用率过高
      - alert: HighJvmMemoryUsage
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存使用率过高"
          description: "应用 {{ $labels.application }} JVM 堆内存使用率超过 85%，当前值: {{ $value | printf \"%.2f\" }}%"

      # JVM 堆内存即将耗尽
      - alert: JvmMemoryCritical
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "JVM 堆内存即将耗尽"
          description: "应用 {{ $labels.application }} JVM 堆内存使用率超过 95%，当前值: {{ $value | printf \"%.2f\" }}%"

      # GC 时间过长
      - alert: HighGcTime
        expr: |
          rate(jvm_gc_pause_seconds_sum[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GC 时间过长"
          description: "应用 {{ $labels.application }} GC 时间占比过高，当前值: {{ $value | printf \"%.2f\" }}s/s"

  # 数据库告警规则
  - name: database_alerts
    rules:
      # MySQL 连接数过高
      - alert: HighMysqlConnections
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL 连接数过高"
          description: "MySQL 连接数超过最大连接数的 80%，当前值: {{ $value | printf \"%.2f\" }}"

      # MySQL 慢查询过多
      - alert: HighMysqlSlowQueries
        expr: rate(mysql_global_status_slow_queries[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL 慢查询过多"
          description: "MySQL 每分钟慢查询数超过 10，当前值: {{ $value | printf \"%.2f\" }}"

  # Redis 告警规则
  - name: redis_alerts
    rules:
      # Redis 内存使用率过高
      - alert: HighRedisMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 内存使用率过高"
          description: "Redis 内存使用率超过 80%，当前值: {{ $value | printf \"%.2f\" }}%"

      # Redis 连接数过高
      - alert: HighRedisConnections
        expr: redis_connected_clients / redis_config_maxclients * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 连接数过高"
          description: "Redis 连接数超过最大连接数的 80%，当前值: {{ $value | printf \"%.2f\" }}%"

  # 系统告警规则
  - name: system_alerts
    rules:
      # CPU 使用率过高
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU 使用率过高"
          description: "服务器 {{ $labels.instance }} CPU 使用率超过 80%，当前值: {{ $value | printf \"%.2f\" }}%"

      # 内存使用率过高
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率过高"
          description: "服务器 {{ $labels.instance }} 内存使用率超过 85%，当前值: {{ $value | printf \"%.2f\" }}%"

      # 磁盘使用率过高
      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "磁盘使用率过高"
          description: "服务器 {{ $labels.instance }} 磁盘 {{ $labels.mountpoint }} 使用率超过 85%，当前值: {{ $value | printf \"%.2f\" }}%"

      # 磁盘即将耗尽
      - alert: DiskCritical
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "磁盘即将耗尽"
          description: "服务器 {{ $labels.instance }} 磁盘 {{ $labels.mountpoint }} 使用率超过 95%，当前值: {{ $value | printf \"%.2f\" }}%"