# 应用服务 WEB 访问端口
server.port=8081
# 上下文路径
#server.servlet.context-path=/backend

# Spring configuration
spring.application.name=backend

# CORS configuration
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# 解决Spring Boot 2.6+与Swagger的兼容性问题
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# MySQL数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/journal_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=${wsl_mysql_username}
#spring.datasource.password=${wsl_mysql_password}
spring.datasource.username=root
spring.datasource.password=123456

# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=cn.deru.backend.model
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
