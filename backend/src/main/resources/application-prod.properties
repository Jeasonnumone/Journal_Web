server.port=8080
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:journal_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:journal}
spring.datasource.password=${DB_PASSWORD:journal123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=cn.deru.backend.model
mybatis-plus.configuration.map-underscore-to-camel-case=true

jwt.secret=${JWT_SECRET:my-super-secret-key-for-jwt-production-123456}
jwt.access-expiration=900
jwt.refresh-expiration=604800

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=5000ms

spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.default-encoding=UTF-8

verify.code.length=6
verify.code.expire=300
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

logging.level.cn.deru.backend=info
logging.level.com.zaxxer.hikari=warn

task.view-count.sync-enabled=true
task.view-count.batch-size=100

minio.internal-endpoint=${MINIO_INTERNAL_ENDPOINT:http://minio:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:https://qikanbaidu.cn/minio}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=journal

# Actuator 监控配置
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=journal-backend